name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/arad_store_test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run the tests
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --tag arad-store-backend:ci backend

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build and start the whole stack
        run: docker compose up -d --build --wait

      - name: Seed the application database
        run: docker compose exec -T backend python -m app.seed

      - name: Smoke test the API and frontend
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health/db

          curl -fsS "http://localhost:8000/api/v1/products?limit=1" \
            | python3 -c "import json, sys; data = json.load(sys.stdin); assert data['total'] >= 15, data"

          curl -fsS http://localhost:5500/ | grep -q "Arad Store"

          admin_password=$(grep '^SEED_ADMIN_PASSWORD=' .env | cut -d= -f2-)

          curl -fsS \
            -c /tmp/cookies.txt \
            -X POST \
            http://localhost:8000/api/v1/auth/login \
            --data-urlencode "username=admin@example.com" \
            --data-urlencode "password=${admin_password}" \
            | python3 -c "import json, sys; res = json.load(sys.stdin); assert res.get('authenticated') is True, res"

          curl -fsS \
            -b /tmp/cookies.txt \
            http://localhost:8000/api/v1/admin/stats

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Python for E2E setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python dependencies for E2E setup
        run: pip install -r backend/requirements-dev.txt

      - name: Get PostgreSQL credentials
        shell: bash
        run: |
          POSTGRES_USER=$(docker compose exec -T postgres printenv POSTGRES_USER | tr -d '\r')
          POSTGRES_DB=$(docker compose exec -T postgres printenv POSTGRES_DB | tr -d '\r')

          if [ -z "$POSTGRES_USER" ]; then
            echo "POSTGRES_USER is empty"
            exit 1
          fi

          if [ -z "$POSTGRES_DB" ]; then
            echo "POSTGRES_DB is empty"
            exit 1
          fi

          echo "POSTGRES_USER=${POSTGRES_USER}" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=${POSTGRES_DB}" >> "$GITHUB_ENV"

          echo "PostgreSQL user: ${POSTGRES_USER}"
          echo "PostgreSQL database: ${POSTGRES_DB}"

      - name: Create E2E test database
        shell: bash
        run: |
          if docker compose exec -T postgres \
            psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -tc "SELECT 1 FROM pg_database WHERE datname = 'arad_store_test'" \
            | grep -q 1; then
            echo "Database arad_store_test already exists."
          else
            echo "Creating database arad_store_test..."

            docker compose exec -T postgres \
              psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "CREATE DATABASE arad_store_test"

            echo "Database arad_store_test created."
          fi

      - name: Build E2E database URL
        shell: bash
        run: |
          DATABASE_URL=$(docker compose exec -T backend printenv DATABASE_URL | tr -d '\r')

          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is not set inside backend container"
            exit 1
          fi

          E2E_DATABASE_URL=$(
            printf '%s' "$DATABASE_URL" |
            python3 -c '
          import sys
          from urllib.parse import urlsplit, urlunsplit

          value = sys.stdin.read().strip()

          if not value:
              raise SystemExit("DATABASE_URL is empty")

          url = urlsplit(value)

          if not url.scheme:
              raise SystemExit("DATABASE_URL has no scheme")

          if not url.netloc:
              raise SystemExit("DATABASE_URL has no host/netloc")

          e2e_url = urlunsplit(
              (
                  url.scheme,
                  url.netloc,
                  "/arad_store_test",
                  url.query,
                  url.fragment,
              )
          )

          print(e2e_url)
          '
          )

          if [ -z "$E2E_DATABASE_URL" ]; then
            echo "Failed to build E2E_DATABASE_URL"
            exit 1
          fi

          echo "::add-mask::$E2E_DATABASE_URL"
          echo "E2E_DATABASE_URL=${E2E_DATABASE_URL}" >> "$GITHUB_ENV"

          echo "E2E database URL created successfully."

      - name: Run migrations for E2E test database
        run: |
          docker compose exec -T \
            -e DATABASE_URL="$E2E_DATABASE_URL" \
            backend \
            alembic upgrade head

      - name: Seed E2E test database
        run: |
          docker compose exec -T \
            -e DATABASE_URL="$E2E_DATABASE_URL" \
            backend \
            python -m app.seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E and axe-core accessibility tests
        env:
          NO_WEBSERVER: "1"
          POSTGRES_PORT: "5432"
        run: npx playwright test

      - name: Upload Playwright report and test traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes