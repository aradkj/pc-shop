[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
filterwarnings =
    error::sqlalchemy.exc.SAWarning
    # Starlette >= 1.7 prefers the "httpx2" fork for its TestClient and only *warns* when plain
    # "httpx" (this project's required HTTP client) is installed. Behaviour is identical.
    ignore:Using .httpx. with .starlette.testclient.
