# Serves the static frontend. The browser talks to the API directly (see frontend/js/config.js).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate so edits show up immediately during development.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /pages/404.html;
}
