<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My profile · Arad Store</title>
  <meta name="description" content="Your account details." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0c11" />
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
  <script type="module" src="../js/main.js"></script>
</head>
<body data-page="profile" data-root="../" data-auth="required">
  <header class="site-header" id="site-header"></header>
  <main id="main" tabindex="-1">
    <noscript>
      <div class="container page"><div class="alert alert--error">Arad Store needs JavaScript to load products, your cart and your orders. Please enable it and reload the page.</div></div>
    </noscript>

    <div class="container page">
      <header class="page-header"><div><h1>My profile</h1></div></header>
      <div class="profile-grid">
        <section class="panel" aria-labelledby="account-title">
          <h2 class="panel__title" id="account-title">Account details</h2>
          <div id="profile-account"></div>
        </section>
        <section class="panel" aria-labelledby="password-title">
          <h2 class="panel__title" id="password-title">Change password</h2>
          <form id="change-password-form" class="form" novalidate>
            <div data-form-alert role="alert" hidden></div>
            <div class="field">
              <label for="current_password">Current password</label>
              <input class="input" type="password" id="current_password" name="current_password" required />
            </div>
            <div class="field">
              <label for="new_password">New password</label>
              <input class="input" type="password" id="new_password" name="new_password" required minlength="8" />
            </div>
            <div class="field">
              <label for="confirm_new_password">Confirm new password</label>
              <input class="input" type="password" id="confirm_new_password" name="confirm_new_password" required minlength="8" />
            </div>
            <button type="submit" class="btn btn--primary">Update password</button>
          </form>
        </section>
        <section class="panel" aria-labelledby="recent-title">
          <h2 class="panel__title" id="recent-title">Recent orders</h2>
          <div id="profile-orders"></div>
        </section>
      </div>
    </div>

  </main>
  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
