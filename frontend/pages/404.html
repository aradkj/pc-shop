<!doctype html>
<!-- Absolute asset paths on purpose: the web server returns this page for any missing URL, at any depth. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Arad Store</title>
  <meta name="description" content="The requested hardware address does not exist or has been relocated." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090a0f" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <script type="module" src="/js/main.js"></script>
</head>
<body data-page="notfound" data-root="/">
  <header class="site-header" id="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="container page">
      <div class="state state--404">
        <p class="error-code">404</p>
        <span class="badge badge--accent state__badge">SYSTEM FAULT // BUS NOT FOUND</span>
        <h1 class="state__title">Hardware Address Missing</h1>
        <p>The requested component endpoint does not exist on the current system bus or has been relocated.</p>
        <div class="state__actions">
          <a class="btn btn--primary" href="/index.html">Return to Base</a>
          <a class="btn btn--secondary" href="/pages/products.html">Browse Catalogue</a>
        </div>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
