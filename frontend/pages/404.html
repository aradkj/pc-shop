<!doctype html>
<!-- Absolute asset paths on purpose: the web server returns this page for any missing URL, at any depth. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Arad Store</title>
  <meta name="description" content="The page you are looking for does not exist." />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0c11" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <script type="module" src="/js/main.js"></script>
</head>
<body data-page="notfound" data-root="/">
  <header class="site-header" id="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="container page">
      <div class="state">
        <p class="error-code">404</p>
        <h1 class="state__title">Page not found</h1>
        <p>The page you are looking for does not exist or has moved.</p>
        <p><a class="btn btn--primary" href="/index.html">Back to the store</a> <a class="btn btn--secondary" href="/pages/products.html">Browse products</a></p>
      </div>
    </div>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
</body>
</html>
